# Estate config for datapai-platform-be/scripts/xengine.py --estate — the CFD tick estate: ONE producer that is not a dbt project
# (the Kafka Connect Iceberg sink, catalogued in Glue database `cfd`) and TWO dbt consumers reading the same Iceberg tables in place:
# Snowflake (audit tier, Glue-backed Iceberg tables with AUTO_REFRESH) and ClickHouse (realtime/serving tier, iceberg() views).
# Identity convention: glue:<db>.<table> (declared in each consumer's _sources.yml as meta.physical_identity).
pipeline_id: cfd_xengine_mesh
region: ap-southeast-2
snowflake: {profile: datapai_snowflake, target: dev}

# Glue-backed pointers in Snowflake for the sink-written tables. mode=glue: Snowflake follows Glue by itself; run once, re-run only
# when a table is added to the lake.
# Snowflake-written Iceberg marts -> Glue pointers (defer-to-lake: DuckDB dev reads PROD marts in place; Python/Athena too). Re-run after each prod build.
glue_sync:
  - {database: DATAPAI, schemas: [CFD_MESH], glue_database: cfd_mesh}

snowflake_sync:
  - glue_database: cfd
    database: DATAPAI
    schema: CFD_LAKE
    external_volume: CFD_LAKE_VOL
    catalog_integration: CFD_OBJ_CAT
    volume_base_url: s3://datapai-cfd-lake/
    mode: glue
    glue_catalog_integration: GLUE_STOCK_COMMON

# Consumers only: the producer is the sink. Each entry = one repo's dbt artefacts (manifest.json + catalog.json from `dbt docs generate`).
# dbt_bin / profiles_dir per project (2026-10-13): each team picks its dbt — v1 venv for Athena (no v2 adapter) and ClickHouse (v2 private beta), dbt-oss v2 for Snowflake/Databricks.
projects:
  - {name: xengine-consumer-cfd-snowflake,  project_dir: /home/ec2-user/git/xengine-consumer-cfd-snowflake,  engine: snowflake,  dialect: snowflake,  target_dir: target, dbt_bin: /home/ec2-user/venv_dbt2/bin/dbt, profiles_dir: /home/ec2-user/.dbt}
  - {name: xengine-consumer-cfd-clickhouse, project_dir: /home/ec2-user/git/xengine-consumer-cfd-clickhouse, engine: clickhouse, dialect: clickhouse, target_dir: target, dbt_bin: /home/ec2-user/venv_ai_etl/bin/dbt, profiles_dir: /home/ec2-user/.dbt}
lineage_out: lineage_xengine.json
